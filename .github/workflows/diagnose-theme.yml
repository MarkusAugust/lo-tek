name: Diagnose the theme crash

# Temporary, and only on this branch. The Maven job for 0.44.0 failed once in
# `lotekTheme` with "Trapped on unreachable instruction", on ubuntu-26.04 with
# Java 17, and nowhere else. This runs the same tests on both images and both
# Java versions, many times, to see where it fails and how often. Nothing is
# published.
on:
  push:
    branches: [diagnose-theme-crash]

permissions:
  contents: read

jobs:
  theme:
    name: ${{ matrix.os }}, Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
        java: ["17", "21"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: The machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Flags"
          free -m

      # As the Maven job runs them: every module, from the npm package.
      - name: The whole test suite
        id: whole
        continue-on-error: true
        working-directory: kotlin
        run: ./gradlew test

      - name: The plugin tests, fifteen more times
        working-directory: kotlin
        run: |
          failed=0
          for i in $(seq 1 15); do
            if ! ./gradlew :gradle-plugin:test --rerun > "run-$i.log" 2>&1; then
              failed=$((failed + 1))
              echo "::group::Run $i failed"
              grep -v '^\s*at ' "run-$i.log" | grep -B4 -A25 "FAILED" | head -120
              echo "::endgroup::"
            fi
          done
          echo "$failed of 15 runs failed. The whole suite before them: ${{ steps.whole.outcome }}."
          [ "$failed" -eq 0 ] && [ "${{ steps.whole.outcome }}" = "success" ]
