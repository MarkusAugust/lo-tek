[build]
  base = "."
  command = "bun install --frozen-lockfile && bun --filter @lo-tek/interfaces build && cd documentation && npx astro build"
  publish = "documentation/dist"

# Node comes from `.node-version` in the base directory, as in every workflow.
# Netlify has no file for Bun, so the version is written here, and
# `scripts/check-engines.ts` requires it to be the one CI pins.
[build.environment]
  BUN_VERSION = "1.3.14"
